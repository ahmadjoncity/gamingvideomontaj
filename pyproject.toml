[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemontage-ai"
version = "0.1.0"
description = "AI-powered desktop app that automatically edits gaming videos into epic montages for YouTube, TikTok and Shorts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yoki", email = "you@example.com" }]
keywords = [
    "video-editing",
    "gaming",
    "montage",
    "ai",
    "moviepy",
    "whisper",
    "automation",
    "youtube",
    "tiktok",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

dependencies = [
    "customtkinter>=5.2.2",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "moviepy>=1.0.3,<2.0.0",
    "opencv-python>=4.9.0",
    "pydub>=0.25.1",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.4.9",
    "proglog>=0.1.10",
]

[project.optional-dependencies]
# Heavy / optional AI features. Install with: pip install "gamemontage-ai[ai]"
ai = [
    "faster-whisper>=1.0.0",
    "pytesseract>=0.3.10",
]
# Text-to-speech voiceover support
tts = [
    "edge-tts>=6.1.10",
]
# Everything
full = [
    "faster-whisper>=1.0.0",
    "pytesseract>=0.3.10",
    "edge-tts>=6.1.10",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/yoki/gamemontage-ai"
Repository = "https://github.com/yoki/gamemontage-ai"
Issues = "https://github.com/yoki/gamemontage-ai/issues"

[project.scripts]
gamemontage = "gamemontage.__main__:main"

[project.gui-scripts]
gamemontage-gui = "gamemontage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamemontage = ["assets/*", "../configs/*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
